<div class="products-header">
  <span class="spacer"></span>
  <button mat-icon-button class="profile-btn" [matMenuTriggerFor]="profileMenu" aria-label="Profile">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #profileMenu="matMenu">
    <div class="profile-header">
      <mat-icon>account_circle</mat-icon>
      <span class="profile-username">{{ username }}</span>
    </div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</div>

<BI-Nav
  [BIGrid]="grid"
  [PageTitle]="'Products'"
  [RowTitle]="rowTitle"
  [CanInsert]="true"
  [CanUpdate]="true"
  [CanDelete]="true"
  [CanSave]="true"
  [CanViewAttachments]="true"
  [CanAddAttachments]="true"
  [CanDeleteAttachments]="true"
  [CanPrint]="false"
  [deleteConfirmMsg]="true"
  [navButtons]="{}"
  (ActionClicked)="onActionClicked($event)">
</BI-Nav>

<mat-tab-group>
  <mat-tab label="Overview">
    <BI-Grid
      #grid
      [DataService]="dataService"
      [Columns]="columns"
      [changeSet]="changeSet"
      GridName="ProductsGrid"
      DomID="productsGridDom"
      [HasPaging]="true"
      (OnLoadData)="onLoadData($event)"
      (AfterSave)="afterSave($event)"
      (AfterAdd)="afterAdd($event)"
      (RowChange)="onRowChange($event)"
      (CellClick)="onCellClick($event)">
    </BI-Grid>
  </mat-tab>
  <mat-tab label="General">
    <div class="general-tab-placeholder">
      <p>General tab content (placeholder for additional per-record settings)</p>
    </div>
  </mat-tab>
</mat-tab-group>
